<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#1B2F4F">
<title>Acesso restrito | AV Brasil Proteção</title>
<style>
@font-face{font-family:Outfit;font-weight:400;font-display:swap;src:url(outfit-400.woff2) format("woff2")}
@font-face{font-family:Outfit;font-weight:600;font-display:swap;src:url(outfit-600.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;background:#1B2F4F;color:#fff;display:grid;place-items:center;padding:24px;
  background-image:radial-gradient(900px 500px at 15% -10%,rgba(63,106,168,.35),transparent 60%),radial-gradient(700px 420px at 100% 110%,rgba(227,165,45,.10),transparent 60%)}
main{width:100%;max-width:420px}
.logo{display:block;height:44px;width:auto;margin:0 auto 36px}
.card{background:#fff;color:#151C26;border-radius:24px;padding:32px 28px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
h1{font-size:26px;line-height:32px;font-weight:600;margin:0 0 8px;color:#1B2F4F;letter-spacing:-.01em}
p{margin:0 0 22px;font-size:16px;line-height:24px;color:#4F5B6C}
label{display:block;font-size:14px;font-weight:600;margin-bottom:8px;color:#1B2F4F}
input{width:100%;height:52px;border-radius:14px;border:1.5px solid #B9C3D3;padding:0 16px;font:inherit;font-size:17px;color:#151C26;background:#fff}
input:focus{outline:3px solid rgba(42,74,122,.35);outline-offset:1px;border-color:#2A4A7A}
button{margin-top:16px;width:100%;height:54px;border:0;border-radius:999px;background:#E3A52D;color:#1B2F4F;font:inherit;font-size:17px;font-weight:600;cursor:pointer;transition:background .2s}
button:hover{background:#F0B94D}
button:focus-visible{outline:3px solid #1B2F4F;outline-offset:3px}
.err{display:none;margin:14px 0 0;padding:12px 14px;border-radius:12px;background:#FDECEA;color:#8A1F17;font-size:15px;line-height:22px}
.err.on{display:block}
small{display:block;text-align:center;margin-top:22px;color:rgba(255,255,255,.7);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.svg" alt="AV Brasil Proteção">
  <form class="card" method="post" action="/acesso/" autocomplete="off">
    <h1>Acesso restrito</h1>
    <p>Este protótipo está em validação. Digite o código de acesso para continuar.</p>
    <label for="codigo">Código de acesso</label>
    <input id="codigo" name="codigo" type="password" required autofocus autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="erro">
    <div id="erro" class="err" role="alert">Código incorreto. Confira e tente de novo.</div>
    <button type="submit">Entrar</button>
  </form>
  <small>Conteúdo confidencial, não indexado em buscadores.</small>
</main>
<script>
try{if(new URLSearchParams(location.search).get('erro')){document.getElementById('erro').classList.add('on');history.replaceState(null,'','/acesso/')}}catch(e){}
/* Só para teste local: abrindo este arquivo direto do disco (file://) não há servidor, então o código é conferido aqui.
   Online (Vercel) este trecho não roda: quem confere é o servidor (middleware.js), antes de entregar qualquer arquivo. */
if(location.protocol==='file:'){
  document.querySelector('form').addEventListener('submit',async function(e){
    e.preventDefault();
    var v=document.getElementById('codigo').value.trim(),err=document.getElementById('erro');
    var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('avb-prototipo-02:'+v));
    var hex=Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
    if(v&&hex==='a52f407e253aedd2c5a2866cd69315b4d14a5ff095f581f4e312e551c28546fc'){location.href='../prototipo-02/variacao/index.html'}else{err.classList.add('on');document.getElementById('codigo').select()}
  });
}
</script>
</body>
</html>
